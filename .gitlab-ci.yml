include:
  - project: "ci/core-cicd"
    ref: main
    file: "luminet.gitlab-ci.yml"
  - project: "ci/common-ci"
    ref: master
    file: "npm/publish-npm.gitlab-ci.yml"

unit_test_js:
  stage: test
  image: $NODEJS_IMAGE
  tags:
    - ci
  before_script:
    - if [ "$NPM_LUMI_HOST" != "" ]; then
        npm set registry $NPM_LUMI_HOST;
      fi
    - npm install -g jest@29.5.0
    - echo $SRC_PATH
    - cd "$SRC_PATH"
    - npm install
  script:
    - npm run test-coverage
  allow_failure: false
  cache:
    - key:
        files:
          - package.json
          - package-lock.json
      paths:
        - node_modules
  artifacts:
    when: always
    paths:
      - ./**/lcov.info
    expire_in: 1 day

publish_npm:
  stage: deploy
  image: "$NODEJS_IMAGE"
  needs: ["sonar_js"]
  script:
    - npm install -g npm-cli-login
    - npm-cli-login -u $NPM_LUMI_USER_NAME -p $NPM_LUMI_USER_PASSWORD -e $NPM_LUMI_USER_EMAIL -r $NPM_LUMI_HOST
    - npm set registry $NPM_LUMI_HOST
    - npm i
    - npm run reg
    - npm run build
    - npx semantic-release
